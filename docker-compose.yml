services:

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: admin123
      MARIADB_DATABASE: products_db
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin123

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./BBDD/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped

    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306

    ports:
      - "8080:80"

    depends_on:
      - mariadb

  api:
    build: ./api
    container_name: api
    restart: unless-stopped

    environment:
      DATABASE_URL: mysql+pymysql://admin:admin123@mariadb:3306/products_db

    ports:
      - "8000:8000"

    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data: